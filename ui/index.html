<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#000;--card:#070707;--tx:#ece8dc;--mut:#8d897d;--bd:#1f1f1f;--bd2:#333;--ac:#ffb000;--pass:#5fd4a0;--warn:#ff8a3d;--fail:#ff4b4b;--skip:#6b675d;--inp:#0b0b0b;--moon:#f4efe0}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,system-ui,sans-serif;background:radial-gradient(420px circle at var(--mx,50%) var(--my,15%),rgba(255,176,0,.075),transparent 65%),#000;background-attachment:fixed}
body[data-eye=alarm]{background:radial-gradient(420px circle at var(--mx,50%) var(--my,15%),rgba(255,75,75,.09),transparent 65%),#000;background-attachment:fixed}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:4px 0 8px}
.brand{display:flex;align-items:center;gap:20px}
#eye{width:104px;height:104px;flex:none;filter:drop-shadow(0 0 20px rgba(255,176,0,.3))}
body[data-eye=alarm] #eye{filter:drop-shadow(0 0 20px rgba(255,75,75,.45))}
#eye .iris{fill:url(#irisG)}body[data-eye=alarm] #eye .iris{fill:url(#irisR)}
#eye .pupil{transform-box:fill-box;transform-origin:center;transition:transform .5s ease}
body[data-eye=run] #eye .pupil{transform:scale(.55,1.1)}
#eye .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 11s infinite}
body[data-eye=alarm] #eye .lid{animation:none;transform:scaleY(.38)}
body[data-eye=run] #eye .iris{animation:scan 1.6s ease-in-out infinite alternate}
@keyframes blink{0%,95%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
@keyframes scan{from{opacity:.75}to{opacity:1}}
h1{margin:0;font:400 34px/1.1 "Palatino Linotype",Sylfaen,Georgia,serif;letter-spacing:.16em;color:var(--moon)}
header p{margin:6px 0 0;color:var(--mut);max-width:34ch}
/* tabs */
#tabs{display:flex;gap:30px;border-bottom:1px solid var(--bd);margin:18px 0 26px}
#tabs button{position:relative;background:none;border:0;border-radius:0;padding:10px 2px 12px;font-size:17px;color:var(--mut)}
#tabs button[aria-selected=true]{color:var(--moon)}
#tabs button[aria-selected=true]::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:var(--ac)}
#tabs button:hover{color:var(--moon);border:0}
body[data-eye=alarm] #tabWatch::before,body[data-eye=run] #tabTest::before{content:"";position:absolute;top:10px;inset-inline-end:-10px;width:7px;height:7px;border-radius:50%;background:var(--fail)}
body[data-eye=run] #tabTest::before{background:var(--ac)}
[data-panel][hidden]{display:none!important}
/* shared */
h2{font:400 21px/1.3 "Palatino Linotype",Sylfaen,Georgia,serif;margin:0 0 6px;color:var(--moon)}
.help{color:var(--mut);font-size:13px;margin:2px 0 0}
label.l{display:block;font-weight:600;margin:12px 0 4px;color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:11px 13px;border:1px solid var(--bd2);border-radius:0;background:var(--inp);color:var(--tx);font:inherit;direction:ltr;text-align:left}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;padding:9px 18px;border-radius:0;border:1px solid var(--bd2);background:transparent;color:var(--tx);cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
button.go{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700;padding:11px 28px}
button.go:hover:not(:disabled){background:#ffc83d;color:#000}
button.stop{border-color:#5a2020;color:var(--fail)}button.stop:hover:not(:disabled){border-color:var(--fail);color:var(--fail)}
button:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
#err,#mErr{color:var(--fail);font-weight:600}
details.more{margin-top:16px;border-top:1px solid var(--bd);padding-top:12px}
details.more>summary,details:not(.sec)>summary{cursor:pointer;font-weight:600;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{padding:10px 14px;margin-bottom:16px;border:1px solid var(--warn);color:var(--warn)}
/* watch */
.addbar{display:flex;gap:0;margin:18px 0 0}.addbar input{flex:1;font-size:17px;padding:14px 16px}.addbar button{flex:none}
.watch{margin-top:22px;border-top:1px solid var(--bd)}
.wrow{display:grid;grid-template-columns:12px minmax(160px,1.2fr) 230px auto auto;gap:10px 22px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--bd);position:relative}
.wrow.down{background:linear-gradient(90deg,rgba(255,75,75,.10),transparent 70%)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--skip)}
.wrow.up .dot{background:var(--pass);animation:breathe 3.2s ease-in-out infinite}.wrow.down .dot{background:var(--fail)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(95,212,160,.55)}60%{box-shadow:0 0 0 8px rgba(95,212,160,0)}}
.who{min-width:0}.who b{display:block;font-size:17px;color:var(--moon)}.who .url{display:block;color:var(--mut);font-size:12px;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis}
.who .st{font-size:13px;font-weight:700}.wrow.up .st{color:var(--pass)}.wrow.down .st{color:var(--fail)}.wrow.off .st{color:var(--skip)}
.note{display:block;color:var(--warn);font-size:12px}
.nums{display:flex;gap:22px;margin:0}.nums div{text-align:start}.nums dt{color:var(--mut);font-size:11px}.nums dd{margin:0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{padding:3px 10px;font-size:12px;color:var(--mut);border-color:var(--bd2)}
.deepline{grid-column:2/-1;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){.grid{grid-template-columns:1fr}#eye{width:78px;height:78px}h1{font-size:26px}.wrow{grid-template-columns:12px 1fr}.wrow .spk,.wrow .nums,.wrow .acts{grid-column:2}}

/* monitor: sub-screens */
#subnav{display:flex;gap:0;margin:0 0 22px;border:1px solid var(--bd2);width:max-content;max-width:100%;overflow-x:auto}
#subnav button{border:0;border-inline-end:1px solid var(--bd2);padding:8px 20px;font-size:15px;color:var(--mut);white-space:nowrap}
#subnav button:last-child{border-inline-end:0}
#subnav button[aria-selected=true]{background:rgba(255,176,0,.1);color:var(--ac)}
#subnav button:hover:not(:disabled){border-color:var(--bd2);border-inline-end:1px solid var(--bd2)}
.v{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sumstrip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bd2);margin:16px 0 8px}
.sumstrip>div{padding:14px 18px;border-inline-end:1px solid var(--bd)}.sumstrip>div:last-child{border-inline-end:0}
.sumstrip dt{color:var(--mut);font-size:12px}.sumstrip dd{margin:2px 0 0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--moon)}
.sumstrip dd.bad{color:var(--fail)}.sumstrip dd.good{color:var(--pass)}.sumstrip dd.mid{color:var(--warn)}
.verdict{margin:6px 0 0;font-size:15px;color:var(--mut)}.verdict.bad{color:var(--fail)}.verdict.mid{color:var(--warn)}.verdict.good{color:var(--pass)}
.wrow.warn .dot{background:var(--warn)}.wrow.warn .st{color:var(--warn)}.wrow.nonet .st{color:var(--mut)}
.wrow.warn{background:linear-gradient(90deg,rgba(255,138,61,.07),transparent 60%)}
.lnk{background:none;border:0;padding:0;text-align:start;font-size:17px;font-weight:700;color:var(--moon)}.lnk:hover:not(:disabled){color:var(--ac);border:0}
.strip{grid-column:2/-1;display:flex;gap:2px;direction:ltr;height:12px}.strip i{flex:1;background:var(--bd2);min-width:2px}.strip i.g{background:#2f7d5d}.strip i.y{background:var(--warn)}.strip i.r{background:var(--fail)}
.pick{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;margin:0 0 8px;margin-inline-end:8px;font-size:14px}
.pick.on{border-color:var(--ac);color:var(--ac)}.pick i{width:8px;height:8px;border-radius:50%;background:var(--skip)}
.pick i.up{background:var(--pass)}.pick i.warn{background:var(--warn)}.pick i.down{background:var(--fail)}
.shead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:6px 0 4px}
.shead h2{font-size:26px;margin:0}.shead .url{direction:ltr;text-align:start;color:var(--mut);font-size:13px;display:block}
.lvl{display:inline-block;font-weight:700;font-size:13px;padding:1px 12px;border:1px solid currentColor;border-radius:99px;margin-inline-end:8px}
.lvl.up{color:var(--pass)}.lvl.warn{color:var(--warn)}.lvl.down{color:var(--fail)}.lvl.off,.lvl.wait,.lvl.nonet{color:var(--skip)}
.blk{border-top:1px solid var(--bd);margin-top:26px;padding-top:16px}.blk h3{font:400 18px/1.3 "Palatino Linotype",Sylfaen,Georgia,serif;margin:0 0 10px;color:var(--moon)}
.wf{display:flex;height:16px;direction:ltr;gap:2px;margin:10px 0 8px}.wf i{display:block;min-width:3px}
.wfk{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--mut)}.wfk span{display:inline-flex;gap:7px;align-items:center}.wfk b{color:var(--tx);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wfk em{width:10px;height:10px;display:inline-block}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.stages span{padding:3px 12px;border:1px solid var(--bd2);color:var(--skip);font-size:13px}.stages span.ok{border-color:#2f7d5d;color:var(--pass)}.stages span.no{border-color:var(--fail);color:var(--fail);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{color:var(--mut);font-weight:600;text-align:start;padding:6px 10px 6px 0;font-size:12px;border-bottom:1px solid var(--bd2)}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid #141414;font-variant-numeric:tabular-nums;vertical-align:top}.tbl .ltr{direction:ltr;text-align:start;unicode-bidi:isolate}
.tbl .bad{color:var(--fail)}.tbl .good{color:var(--pass)}.tbl .mid{color:var(--warn)}.scroll{overflow-x:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin:0}.facts div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #141414}
.facts dt{color:var(--mut);font-size:13px}.facts dd{margin:0;font-weight:600;text-align:end;min-width:0;word-break:break-word;direction:ltr;unicode-bidi:isolate}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:3px 12px;border:1px solid var(--bd2);font-size:13px;color:var(--skip)}.chip.ok{border-color:#2f7d5d;color:var(--pass)}.chip.no{color:var(--mut)}
.tog{display:inline-flex;margin-inline-start:12px;vertical-align:middle}.tog button{padding:2px 12px;font-size:12px;border-color:var(--bd2);color:var(--mut)}.tog button.on{border-color:var(--ac);color:var(--ac)}
.chart svg{width:100%;height:auto;display:block;direction:ltr}
.bigbox{display:flex;align-items:center;gap:18px;padding:16px 20px;border:1px solid var(--bd2);border-inline-start-width:4px;margin-bottom:14px}
.bigbox.up{border-inline-start-color:var(--pass)}.bigbox.down{border-inline-start-color:var(--fail);background:rgba(255,75,75,.07)}
.bigbox b{font:400 24px/1.2 "Palatino Linotype",Sylfaen,Georgia,serif;color:var(--moon);display:block}
.meter{height:8px;background:var(--bd);margin:6px 0 4px}.meter i{display:block;height:100%;background:var(--ac)}.meter.hot i{background:var(--warn)}.meter.crit i{background:var(--fail)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}.cols .blk{margin-top:26px}
textarea{width:100%;padding:11px 13px;border:1px solid var(--bd2);border-radius:0;background:var(--inp);color:var(--tx);font:inherit;direction:ltr;text-align:left;resize:vertical;min-height:70px}
textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
@media(max-width:760px){.sumstrip{grid-template-columns:1fr 1fr}.sumstrip>div:nth-child(2){border-inline-end:0}.sumstrip>div:nth-child(-n+2){border-bottom:1px solid var(--bd)}.facts,.cols{grid-template-columns:1fr}.strip{grid-column:1/-1}}
/* test */
#site{font-size:19px;padding:16px 18px;border-color:var(--bd2)}
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 4px}@media(max-width:760px){.lenses{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--bd2);cursor:pointer;margin:0}
.opt:has(input:checked){border-color:var(--ac);background:rgba(255,176,0,.06)}
.opt input{margin-top:5px;width:16px;height:16px;flex:none;accent-color:var(--ac)}.opt b{display:block;color:var(--moon)}.opt .help{font-size:12px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
#formCard{border:0;padding:0;margin:0 0 26px}
.bar{height:2px;background:var(--bd);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:mv 1.3s ease-in-out infinite alternate}
@keyframes mv{from{margin-inline-start:0}to{margin-inline-start:70%}}
.bar.off i{animation:none;width:100%;opacity:.25}
#live>.card{border:1px solid var(--bd);padding:18px 20px;margin-bottom:14px;background:var(--card)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.pill{padding:1px 11px;border-radius:99px;font-weight:700;border:1px solid currentColor;font-size:13px}
.pill.PASS{color:var(--pass)}.pill.WARN{color:var(--warn)}.pill.FAIL{color:var(--fail)}.pill.SKIP{color:var(--skip)}.pill.T{color:var(--mut)}
details.sec{border-top:1px solid var(--bd);margin:0}
details.sec>summary{padding:10px 4px;font-weight:700;cursor:pointer;color:var(--moon)}
.row{display:flex;gap:12px;padding:7px 4px;border-top:1px solid #141414;align-items:flex-start}
.badge{flex:none;min-width:54px;text-align:center;font-weight:700;font-size:11px;padding:2px 6px;color:#000;margin-top:3px}
.lvl-PASS .badge{background:var(--pass)}.lvl-WARN .badge{background:var(--warn)}.lvl-FAIL .badge{background:var(--fail)}.lvl-SKIP .badge{background:var(--skip);color:#fff}
.rc{min-width:0;flex:1}.nm{font-weight:600}.dt{color:var(--mut);font-size:13px;word-break:break-word}
.hint{font-size:13px;margin-top:4px;padding:6px 10px;background:rgba(255,176,0,.08);border-inline-start:2px solid var(--ac)}
.sum{padding:18px 20px;border:1px solid;margin-bottom:14px}
.sum.ok{border-color:var(--pass);background:rgba(95,212,160,.06)}.sum.w{border-color:var(--warn);background:rgba(255,138,61,.07)}.sum.bad{border-color:var(--fail);background:rgba(255,75,75,.08)}
.sum h2{font-size:22px;margin:0 0 4px}
/* log */
.tl{margin:18px 0 0;border-inline-start:1px solid var(--bd2);padding-inline-start:20px}
.ev{position:relative;padding:0 0 18px}.ev::before{content:"";position:absolute;inset-inline-start:-25px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--skip);box-shadow:0 0 0 3px #000}
.ev.down::before,.ev.deep::before{background:var(--fail)}.ev.changed::before{background:var(--warn)}.ev.up::before{background:var(--pass)}
.ev time{display:block;color:var(--mut);font-size:12px;direction:ltr;text-align:start}
.hist{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.hist .sp{flex:1;min-width:140px;direction:ltr;text-align:start;color:var(--mut);font-size:13px}
a{color:var(--ac)}pre{background:var(--inp);border:1px solid var(--bd);padding:8px;max-height:200px;overflow:auto;font-size:12px;direction:ltr;text-align:left}
#live details.card>summary{cursor:pointer;color:var(--mut)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#eye .lid,#eye .iris,.bar i,.dot{animation:none!important}#eye .pupil{transition:none}}

/* live */
#liveBox{margin:0 0 22px}.lvh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.lvdot{width:10px;height:10px;border-radius:50%;background:var(--fail);animation:lvp 1.4s ease-in-out infinite}.lvh.paused .lvdot{animation:none;background:var(--skip)}
@keyframes lvp{0%,100%{box-shadow:0 0 0 0 rgba(255,75,75,.6)}60%{box-shadow:0 0 0 8px rgba(255,75,75,0)}}
.lvh b{letter-spacing:.2em;font-size:13px}.lvh button{padding:3px 12px;font-size:12px;margin-inline-start:auto}
.lvk{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 4px}.lvk>div dt{color:var(--mut);font-size:11px}.lvk>div dd{margin:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}.lvk .big dd{font-size:40px;line-height:1.1}
.lvk dl{margin:0}.lvt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.lvt th{color:var(--mut);font-weight:600;text-align:start;padding:6px 8px;border-bottom:1px solid var(--bd2);white-space:nowrap}
.lvt td{padding:5px 8px;border-top:1px solid #141414;vertical-align:middle;font-variant-numeric:tabular-nums}.lvt tr.r{cursor:pointer}.lvt tr.r:hover{background:#0d0d0d}.lvt tr.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(255,176,0,.18)}to{background:transparent}}
.lvt td.n{direction:ltr;text-align:start}.stk{display:flex;height:6px;min-width:140px;width:100%;direction:ltr;background:#151515}.stk i{display:block;height:100%}
.ph0{background:#8d897d}.ph1{background:#b8a46a}.ph2{background:#c97a1a}.ph3{background:#ffb000}.ph4{background:#ece8dc}
.lvd td{background:#050505;padding:12px 14px}.lvd .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lvd h4{margin:0 0 5px;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.lvd pre{margin:0 0 8px;max-height:210px}.sc{font-weight:700}.sc.s2{color:var(--pass)}.sc.s3{color:#8fb7ff}.sc.s4{color:var(--warn)}.sc.s5,.sc.s0{color:var(--fail)}
#reqList details.rq{border-top:1px solid #141414}#reqList summary{display:flex;gap:10px;padding:5px 2px;cursor:pointer;font-size:13px;list-style:none;align-items:baseline}#reqList summary::-webkit-details-marker{display:none}
#reqList .u{flex:1;min-width:0;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#reqList .src{font-size:10px;font-weight:700;padding:0 6px;border:1px solid currentColor}
.src.api{color:var(--ac)}.src.site{color:#8fb7ff}.src.browser{color:#c9a7ff}#reqList pre{margin:4px 0 10px}
@media(max-width:700px){.lvd .cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg id="eye" viewBox="0 0 120 120" aria-hidden="true"><defs>
<radialGradient id="irisG" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffe7a3"/><stop offset=".55" stop-color="#ffb000"/><stop offset="1" stop-color="#8a5a00"/></radialGradient>
<radialGradient id="irisR" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffb3a8"/><stop offset=".55" stop-color="#ff6b5e"/><stop offset="1" stop-color="#7a1b1b"/></radialGradient>
<clipPath id="ball"><circle cx="60" cy="60" r="50"/></clipPath></defs>
<circle cx="60" cy="60" r="55" fill="#050505" stroke="#3a3a3a" stroke-width="2"/>
<circle cx="60" cy="60" r="50" fill="#0d0d0d"/>
<g clip-path="url(#ball)"><circle class="iris" cx="60" cy="60" r="34"/>
<g id="pupilG"><ellipse class="pupil" cx="60" cy="60" rx="14" ry="22" fill="#05040d"/><circle cx="52" cy="50" r="5" fill="#fff" opacity=".85"/></g>
<rect class="lid" x="0" y="0" width="120" height="120" fill="#000"/></g></svg><div><h1 data-t="title"></h1><p data-t="sub"></p></div></div>

// Plain-language help for common problems. First match wins.
const HINTS = [
  [/Model failing on the site/i, "الموقع نفسه قال إن الموديل ده فشل، ومكتوب جنبه السبب. 404 يعني الاسم غلط أو مفيش صلاحية، و401 المفتاح مرفوض، والتايم أوت يعني أبطأ من 6 ثواني. صلّحه في Vercel (AI_FAST أو AI_SMART أو المفتاح) وRedeploy.", "The site itself reported this model failed, with the reason. 404 means a wrong name or no access, 401 a rejected key, timeout slower than 6 seconds. Fix it in Vercel (AI_FAST, AI_SMART or the key) and redeploy."],
  [/rests its models/i, "لما موديلين يفشلوا مرة، السيرفر بيسيبهم دقيقة. المستخدم في الوقت ده بياخد رد جاهز بدل رد الـ AI. الحل إنك تصلّح الموديل الفاشل (الصف فوق).", "When two models fail once, the server rests them for a minute and users get the built-in reply instead of the AI. Fix the failing model (row above)."],
  [/slower than the site's 6s/i, "الموقع بيدي كل موديل 6 ثواني، وأي رد أبطأ معناه إن الموديل الأول فشل أو اتأخر والاحتياطي هو اللي ردّ. راجع صفوف الموديلات الفاشلة، أو شغّل الاختبار المباشر بمفاتيحك.", "The site gives each model 6 seconds. A slower answer means the first model failed or was slow and a backup answered. Check the failing-model rows, or run the direct test with your keys."],
  [/not canned|canned/i, "الموقع بيرد بنفس الرد تقريباً على أسئلة مختلفة. غالباً الـ AI مش بيقرا الأسئلة أو الملفات فعلاً.", "The site gives almost the same answer to different questions. The AI is probably not really reading the questions or the files."],
  [/look like nonsense/i, "فيه ردود بتكرر نفسها أو فيها حروف غريبة. جرّب موديل تاني أو قلّل temperature.", "Some answers repeat themselves or contain strange characters. Try another model or lower the temperature."],

const hintFor = (r) => { if (r.level === "PASS") return ""; const h = HINTS.find((x) => x[0].test(r.name + " " + r.detail)); return h ? h[lang === "ar" ? 1 : 2] : ""; };

let lang = localStorage.getItem("mm_lang") || "ar";
const t = (k) => T[lang][k] ?? k;
function applyLang() {

  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });

  $("runLabel").textContent = running ? t("running") : done ? t("finished") : $("runLabel").textContent;
  renderCounts(); renderHistory();

$("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; localStorage.setItem("mm_lang", lang); applyLang(); if (done) renderAttention(); };

let running = false, done = false, rows = [], counts = { PASS: 0, WARN: 0, FAIL: 0, SKIP: 0 }, outDir = "", startAt = 0, clockT = null, curSec = null, es = null, hist = [], lastSummary = null;

function addSection(title) {

}
function addRow(r) {
  if (!curSec) addSection("");

  counts[r.level] = (counts[r.level] || 0) + 1; renderCounts();
  const shot = r.shot && outDir ? ` <a href="/reports/${esc(outDir)}/${esc(r.shot)}" target="_blank">&#128247;</a>` : "";

const vt = (k, ...a) => { let s = VT[lang][k] ?? k; a.forEach((x, i) => { s = s.replace("{" + i + "}", x); }); return s; };

const fmtB = (n) => (n == null ? "-" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(1) + " GB");

function renderSummary() {

  const upN = ss.filter((s) => s.level === "up" || s.level === "warn").length, downN = ss.filter((s) => s.level === "down").length, warnN = ss.filter((s) => s.level === "warn").length, waitN = ss.filter((s) => s.level === "wait").length;
  const w = ss.map((s) => s.w24).filter(Boolean), tn = w.reduce((a, x) => a + x.n, 0);

// ----- charts -----
function rtChart(b, p95) {

  const vals = b.filter((x) => x.ms != null).map((x) => x.ms);
  if (!vals.length && !b.some((x) => x.bad)) return `<div class="help">${vt("noData")}</div>`;
  const max = Math.max(300, ...vals) * 1.1, n = b.length, step = w / n, X = (i) => L + i * step + step / 2, Y = (v) => T + h - (v / max) * h;
  let bands = "", line = "", seg = [];
  const flush = () => { if (seg.length === 1) { const [x, y] = seg[0].split(","); line += `<circle cx="${x}" cy="${y}" r="2.5" fill="var(--ac)"/>`; } else if (seg.length > 1) line += `<polyline fill="none" stroke="var(--ac)" stroke-width="1.6" points="${seg.join(" ")}"/>`; seg = []; };
  b.forEach((x, i) => { if (x.bad) bands += `<rect x="${(L + i * step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${h}" fill="var(--fail)" opacity="${(0.2 + 0.4 * x.bad / Math.max(1, x.n)).toFixed(2)}"/>`; if (x.ms != null) seg.push(`${X(i).toFixed(1)},${Y(x.ms).toFixed(1)}`); else flush(); });
  flush();
  const grid = [0, 0.5, 1].map((f) => { const y = T + h - f * h; return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#1f1f1f"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8d897d">${fmtMs(Math.round(max * f / 10) * 10)}</text>`; }).join("");
  const pl = p95 != null && p95 < max ? `<line x1="${L}" x2="${W - R}" y1="${Y(p95)}" y2="${Y(p95)}" stroke="var(--warn)" stroke-dasharray="4 4" opacity=".7"/><text x="${W - R}" y="${Y(p95) - 4}" text-anchor="end" font-size="11" fill="var(--warn)">${vt("p95")}</text>` : "";
  const t0 = b[0].t, t1 = b[n - 1].t + (b[1] ? b[1].t - b[0].t : 0), long = t1 - t0 >= 20 * 3600e3;
  const lbl = (t) => long ? new Date(t).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : fmtHM(t);
  const xl = [0, 0.25, 0.5, 0.75, 1].map((f) => `<text x="${(L + f * w).toFixed(1)}" y="${H - 6}" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}" font-size="11" fill="#8d897d" style="direction:ltr">${lbl(t0 + f * (t1 - t0))}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(vt("chartT"))}">${grid}${bands}${pl}${line}${xl}</svg>`;
}
function miniLine(arr, max, color) {

  let u = e.url; try { const a = new URL(e.url); u = a.pathname + a.search; } catch { /* keep */ }
  const d = document.createElement("details"); d.className = "rq";
  d.innerHTML = `<summary><span class="src ${e.src}">${e.src}</span><span>${esc(e.method)}</span><span class="${stClass(e.status)}">${e.status || "ERR"}</span><span class="u" title="${esc(e.url)}">${esc(u)}</span><span class="help" dir="ltr">${e.ms} ms</span></summary><pre>${esc(e.method + " " + e.url + "\n" + hdrTxt(e.reqHeaders) + (e.reqBody ? "\n\n" + e.reqBody : ""))}</pre><pre>${esc((e.status ? e.status + " " + (e.statusText || "") : "ERROR " + e.error) + "\n" + hdrTxt(e.resHeaders) + (e.resBody ? "\n\n" + e.resBody : ""))}</pre>`;
  const list = $("reqList"); list.prepend(d); while (list.children.length > 250) list.lastChild.remove();
}

// ---------- the eye ----------
(() => {
  const pg = document.getElementById("pupilG"); let tx = 0, ty = 0;
  addEventListener("pointermove", (e) => {
    document.documentElement.style.setProperty("--mx", e.clientX + "px"); document.documentElement.style.setProperty("--my", e.clientY + "px");
    const r = document.getElementById("eye").getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 300) * 11;
    tx = (dx / d) * k; ty = (dy / d) * k; pg.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)`;
  }, { passive: true });
  const upd = () => { const down = (window.mState?.sites || []).some((x) => x.enabled && x.last && !x.last.ok && !x.last.noNet); document.body.dataset.eye = down ? "alarm" : !$("stopBtn").hidden ? "run" : "idle"; };
  new MutationObserver(upd).observe($("stopBtn"), { attributes: true, attributeFilter: ["hidden"] });
  setInterval(upd, 1500); upd();
})();
try { sub = localStorage.getItem("mm_sub") || "over"; } catch { /* ignore */ }
renderSubnav(); applyLang(); setRunning(false); loadState(true); loadMon(); showTab((() => { try { return localStorage.getItem("mm_tab") || "watch"; } catch { return "watch"; } })());
</script>
